# Continuous Deployment — promotes one build through dev, staging, production.
#
#   verify  → tests run again, so a deploy can never outrun CI
#   docker  → ONE image is built, and that same image reaches all three
#   dev     → deploy, migrate, smoke
#   staging → same, only if dev passed
#   prod    → same, only if staging passed, and only after a human approves
#
# The thing that makes this a promotion rather than three deployments: the image
# is built once, in `docker`, and the same reference is passed down. If each
# environment rebuilt from source they would be three different artifacts, and
# testing one would say nothing about the others — which is how "it worked in
# staging" becomes a sentence people say bitterly.
#
# Each environment skips itself until its secrets exist, so adding this changes
# nothing about the production deployment that works today.

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to promote (default: this commit)'
        required: false
      only:
        description: 'Deploy just one environment: dev | staging | production'
        required: false

# One promotion at a time, never cancelled midway. Two concurrent
# `containerapp update` calls race each other, and a cancelled migration leaves
# a schema in a state nobody recorded.
concurrency:
  group: cd-promotion
  cancel-in-progress: false

permissions:
  contents: read
  # For the OIDC path in the docker job; see the login steps there.
  id-token: write

env:
  IMAGE_NAME: finops-dashboard
  NODE_VERSION: '20'

jobs:
  # ── Independent re-verification ────────────────────────────────────────────
  verify:
    name: Verify before deploying
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      # Deliberately repeated from CI. It costs about a minute and removes the
      # assumption that CI ran at all — a direct push to main, a protection rule
      # someone disabled, a re-run of an old workflow.
      - name: Tests
        run: npm test

  # ── Build the one artifact that gets promoted ──────────────────────────────
  docker:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.image_tag || github.sha }}"
          echo "image=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:$TAG" >> "$GITHUB_OUTPUT"

      # ── Registry authentication ───────────────────────────────────────────
      #
      # Same two paths as the deployment. `az acr login` exchanges the Azure CLI
      # session for a short-lived registry token, so the OIDC path never handles
      # an admin password — which also means ACR's admin account can be disabled
      # once the fallback is retired.
      - name: Choose an authentication method
        id: auth
        env:
          OIDC_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$OIDC_CLIENT_ID" ]; then
            echo "method=oidc" >> "$GITHUB_OUTPUT"
          else
            echo "method=secret" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Azure (OIDC)
        if: steps.auth.outputs.method == 'oidc'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the registry (OIDC)
        if: steps.auth.outputs.method == 'oidc'
        run: |
          # The registry NAME, not the login server: `az acr login` wants
          # "myregistry", the login server is "myregistry.azurecr.io".
          ACR_NAME="${{ secrets.ACR_NAME }}"
          if [ -z "$ACR_NAME" ]; then
            ACR_NAME=$(echo "${{ secrets.ACR_LOGIN_SERVER }}" | cut -d. -f1)
          fi
          az acr login --name "$ACR_NAME"

      - name: Log in to the registry (admin credentials)
        if: steps.auth.outputs.method == 'secret'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # The commit sha is the identifier that matters: it ties a running
          # container back to the exact source that produced it, which makes a
          # rollback a lookup rather than a guess. `latest` is a convenience —
          # nothing deploys from it.
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
            ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scans the image we are about to run, not just the dependency tree.
      # Reports rather than blocks, matching how CI handles the existing
      # advisory backlog.
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH

      - name: Publish scan
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: container-image

  # ── Dev: first contact with a real environment ─────────────────────────────
  dev:
    name: Dev
    needs: docker
    if: >-
      github.event.inputs.only == ''
      || github.event.inputs.only == null
      || github.event.inputs.only == 'dev'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
      image: ${{ needs.docker.outputs.image }}
      # Read at the repository level here, where no environment is declared, so
      # this is production's app. The callee refuses to deploy dev on top of it.
      production_app_name: ${{ secrets.CONTAINER_APP_NAME }}
      # Dev does not need to survive a node going away, and scale-to-zero is the
      # cheapest configuration that still proves the image boots and reaches its
      # database.
      min_replicas: 0
      max_replicas: 1
    secrets: inherit

  # ── Staging: the rehearsal ─────────────────────────────────────────────────
  staging:
    name: Staging
    needs: [docker, dev]
    # `always()` because dev SKIPS ITSELF when unconfigured, and a skipped
    # dependency skips its dependents by default — which would quietly stop the
    # promotion before it reached anything. A dev FAILURE still stops it.
    if: >-
      always()
      && needs.docker.result == 'success'
      && needs.dev.result != 'failure'
      && needs.dev.result != 'cancelled'
      && (github.event.inputs.only == '' || github.event.inputs.only == null || github.event.inputs.only == 'staging')
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      image: ${{ needs.docker.outputs.image }}
      production_app_name: ${{ secrets.CONTAINER_APP_NAME }}
      # Matches production's shape, because a staging environment configured
      # differently from production rehearses a system that does not exist.
      min_replicas: 1
      max_replicas: 3
    secrets: inherit

  # ── Production: behind an approval ─────────────────────────────────────────
  #
  # The approval itself is a GitHub Environment protection rule on `production`,
  # not something this file can assert. deploy-environment.yml declares
  # `environment:`, which is what makes GitHub pause for a required reviewer.
  production:
    name: Production
    needs: [docker, dev, staging]
    if: >-
      always()
      && needs.docker.result == 'success'
      && needs.dev.result != 'failure'
      && needs.staging.result != 'failure'
      && needs.dev.result != 'cancelled'
      && needs.staging.result != 'cancelled'
      && (github.event.inputs.only == '' || github.event.inputs.only == null || github.event.inputs.only == 'production')
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      image: ${{ needs.docker.outputs.image }}
      # No interlock for production: the repository-level CONTAINER_APP_NAME is
      # exactly what it should use, which keeps today's deployment unchanged.
      min_replicas: 1
      max_replicas: 3
    secrets: inherit

  # ── What happened, in one place ────────────────────────────────────────────
  summary:
    name: Promotion summary
    runs-on: ubuntu-latest
    needs: [docker, dev, staging, production]
    if: always()
    steps:
      - name: Write the summary
        run: |
          status() {
            case "$1" in
              success)   echo "deployed" ;;
              skipped)   echo "skipped (not configured)" ;;
              failure)   echo "**FAILED**" ;;
              cancelled) echo "cancelled" ;;
              *)         echo "$1" ;;
            esac
          }
          {
            echo "## Promotion of \`${{ github.sha }}\`"
            echo ""
            echo "Image: \`${{ needs.docker.outputs.image }}\`"
            echo ""
            echo "| Environment | Result |"
            echo "|---|---|"
            echo "| Dev | $(status '${{ needs.dev.result }}') |"
            echo "| Staging | $(status '${{ needs.staging.result }}') |"
            echo "| Production | $(status '${{ needs.production.result }}') |"
          } >> "$GITHUB_STEP_SUMMARY"
