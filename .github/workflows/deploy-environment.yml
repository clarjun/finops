# One environment's deployment, called three times by cd.yml.
#
# A reusable workflow rather than three copies of the same 150 lines. The Azure
# steps are fiddly — provider registration, create-or-update, URL resolution —
# and three copies means a fix applied to production and forgotten in staging,
# which is how staging stops resembling production and stops being a useful
# rehearsal.
#
# ── How an environment is addressed ─────────────────────────────────────────
#
# Every secret here is read by its ORDINARY name — CONTAINER_APP_NAME,
# DATABASE_URL, SESSION_SECRET — and GitHub resolves each to the value defined
# on the environment this job declares. Define them once per environment and the
# same reference picks up the right value.
#
# That only works here, and not in the caller: environment-scoped secrets
# resolve exclusively inside a job that declares `environment:`, which is why
# cd.yml passes `secrets: inherit` rather than forwarding them by hand.
#
# ── Why an environment must prove itself ────────────────────────────────────
#
# When an environment does NOT define a secret, GitHub does not leave it empty —
# it falls back to the REPOSITORY-level value, which is production's. So a
# half-configured `dev` silently resolves to production's app and production's
# database.
#
# An earlier version of this file compared the resolved app name against
# production's and refused on a match. That was not enough, and it failed in
# exactly the way a negative check fails: it guarded the app name but not the
# DATABASE_URL, so a preview ran `db:migrate` against production's database and
# applied 22 migrations before erroring. The deploy was correctly blocked; the
# migration had already happened.
#
# The check is now POSITIVE. Each environment declares its own name in the
# ENVIRONMENT_NAME variable, and nothing runs unless that matches the
# environment being deployed. An unconfigured environment inherits the wrong
# name — or none — and is skipped before it can touch anything.
#
# Production is exempt from the requirement for backwards compatibility: it IS
# the repository-level configuration, so inheriting it is correct there.

name: Deploy to an environment

on:
  workflow_call:
    inputs:
      environment:
        description: 'dev | staging | production'
        required: true
        type: string
      image_tag:
        description: >-
          The tag to deploy, normally the commit sha. Only the TAG crosses the
          job boundary: the registry host is a secret, and GitHub redacts any
          job output containing one — which silently turned a full image
          reference into `***` and had Azure reject the deployment. The full
          reference is assembled below, inside this job.
        required: true
        type: string
      repo_database_fingerprint:
        description: >-
          Digest of the REPOSITORY-level DATABASE_URL, computed by a job that
          declares no environment. A non-production environment whose own
          DATABASE_URL matches this did not set one and inherited production's.
        required: false
        type: string
        default: ''
      image_name:
        description: 'Repository name within the registry'
        required: false
        type: string
        default: 'finops-dashboard'
      run_migrations:
        description: >-
          Whether to apply database migrations before deploying. FALSE for
          pull request previews: a preview must never migrate a shared
          database, and the environment it lands on may not have one of its
          own. Only the promotion pipeline migrates.
        required: false
        type: boolean
        default: true
      min_replicas:
        required: false
        type: number
        default: 1
      max_replicas:
        required: false
        type: number
        default: 3
    outputs:
      url:
        description: 'Public URL of the deployed environment'
        value: ${{ jobs.deploy.outputs.url }}
      deployed:
        description: 'false when the environment is not configured and was skipped'
        value: ${{ jobs.deploy.outputs.deployed }}

permissions:
  contents: read
  # Required for workload identity federation: without it the runner cannot
  # request the OIDC token Azure exchanges for a session. Harmless when the
  # secret-based fallback is in use — an unused token is never minted.
  id-token: write

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Declaring the environment is what makes GitHub resolve environment-scoped
    # secrets AND apply that environment's protection rules. A required reviewer
    # configured on `production` pauses the run here until someone approves —
    # the approval gate is GitHub's, not something this file can fake.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.url.outputs.url }}
    outputs:
      url: ${{ steps.url.outputs.url }}
      deployed: ${{ steps.gate.outputs.configured }}

    steps:
      # ── Is this environment set up at all? ────────────────────────────────
      - name: Check the environment is configured
        id: gate
        env:
          APP_NAME: ${{ secrets.CONTAINER_APP_NAME }}
          RG: ${{ secrets.RESOURCE_GROUP }}
          DB_URL: ${{ secrets.DATABASE_URL }}
          DECLARED: ${{ vars.ENVIRONMENT_NAME }}
          REPO_DB_FP: ${{ inputs.repo_database_fingerprint }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # Fails the job rather than passing it. Refusing to deploy is a
          # legitimate outcome; reporting it as a successful deployment is not,
          # and that is what made dev and staging look like they were rehearsing
          # production when neither had ever run a single container.
          refuse() {
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "$1"
            {
              echo "## $ENVIRONMENT was NOT deployed"
              echo ""
              echo "This environment is not set up, so nothing was deployed and nothing"
              echo "was migrated. The deployment did not partially happen."
              echo ""
              echo "Create it under **Settings -> Environments -> $ENVIRONMENT** with:"
              echo ""
              echo "| Kind | Name | Value |"
              echo "|---|---|---|"
              echo "| Variable | \`ENVIRONMENT_NAME\` | \`$ENVIRONMENT\` |"
              echo "| Secret | \`CONTAINER_APP_NAME\` | that environment's own Container App |"
              echo "| Secret | \`RESOURCE_GROUP\` | its resource group |"
              echo "| Secret | \`DATABASE_URL\` | **its own** database, never production's |"
              echo ""
              echo "Each must be the environment's OWN value. A missing environment secret"
              echo "silently falls back to the repository-level one, which is production's."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          # Production is the repository-level configuration, so inheriting it
          # is correct there and no declaration is required.
          if [ "$ENVIRONMENT" != "production" ]; then
            if [ "$DECLARED" != "$ENVIRONMENT" ]; then
              refuse "::error::Skipping '$ENVIRONMENT'. Its ENVIRONMENT_NAME variable is \
          '${DECLARED:-unset}', not '$ENVIRONMENT' — so this environment has not been set up and \
          every secret it reads would fall back to the repository-level value, which is \
          PRODUCTION'S. Create the '$ENVIRONMENT' environment, set the ENVIRONMENT_NAME variable \
          to '$ENVIRONMENT', and give it its own CONTAINER_APP_NAME and DATABASE_URL."
            fi

            # Declared, and it has A database -- but is it its OWN? An
            # environment secret falls back to the repository-level one when it
            # is not set, so a non-empty value proves nothing. Comparing
            # fingerprints is what distinguishes "mine" from "production's".
            if [ -n "$DB_URL" ] && [ -n "$REPO_DB_FP" ] && [ "$REPO_DB_FP" != "none" ]; then
              MINE=$(printf 'cloudwise-db-fingerprint:%s' "$DB_URL" | sha256sum | cut -c1-16)
              if [ "$MINE" = "$REPO_DB_FP" ]; then
                refuse "::error::Refusing to deploy '$ENVIRONMENT': its DATABASE_URL is \
          byte-for-byte the REPOSITORY-level one, which is PRODUCTION'S database. The \
          environment exists but has no DATABASE_URL of its own, and a missing environment \
          secret silently falls back to the repository value. Set a DATABASE_URL on the \
          '$ENVIRONMENT' environment that points at that environment's own database."
              fi
            fi

            # Declared, but still inheriting the database. Refusing here is the
            # check that was missing when a preview migrated production.
            if [ -z "$DB_URL" ]; then
              refuse "::error::Skipping '$ENVIRONMENT': it declares itself correctly but has no \
          DATABASE_URL of its own."
            fi
          fi

          if [ -z "$APP_NAME" ] || [ -z "$RG" ]; then
            refuse "::error::Skipping '$ENVIRONMENT': CONTAINER_APP_NAME or RESOURCE_GROUP is unset."
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Deploying to $APP_NAME in $RG ($ENVIRONMENT)"

      - name: Choose an authentication method
        id: auth
        if: steps.gate.outputs.configured == 'true'
        env:
          OIDC_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          LEGACY_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -n "$OIDC_CLIENT_ID" ]; then
            echo "method=oidc" >> "$GITHUB_OUTPUT"
            echo "Authenticating with workload identity federation (no stored secret)."
          elif [ -n "$LEGACY_CREDS" ]; then
            echo "method=secret" >> "$GITHUB_OUTPUT"
            echo "::warning::Authenticating with the stored AZURE_CREDENTIALS service \
          principal secret. Set AZURE_CLIENT_ID, AZURE_TENANT_ID and \
          AZURE_SUBSCRIPTION_ID to switch to OIDC and remove the long-lived key."
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
            echo "::error::No Azure credentials configured — neither AZURE_CLIENT_ID \
          (OIDC) nor AZURE_CREDENTIALS."
            exit 1
          fi

      - name: Assemble the image reference
        id: image
        if: steps.gate.outputs.configured == 'true'
        run: |
          # Built here rather than passed in, so the registry host never leaves
          # this job and is never subject to output redaction.
          echo "ref=${{ secrets.ACR_LOGIN_SERVER }}/${{ inputs.image_name }}:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure (OIDC)
        if: steps.auth.outputs.method == 'oidc'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure (stored service principal)
        if: steps.auth.outputs.method == 'secret'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install containerapp CLI extension
        if: steps.gate.outputs.configured == 'true'
        run: az extension add --name containerapp --upgrade -y

      # ── Schema before code, per environment ───────────────────────────────
      #
      # Each environment migrates its OWN database, because DATABASE_URL is an
      # environment secret. Running production's migrations against production
      # only after they have already run against dev and staging is the entire
      # point of having the three.
      - name: Migration gate
        id: migrations
        if: steps.gate.outputs.configured == 'true'
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
          ALLOWED: ${{ inputs.run_migrations }}
        run: |
          # Two conditions, both required. The caller must permit migrations at
          # all — a pull request preview does not — and there must be a database
          # to migrate. The gate above has already established that a
          # non-production environment owns its DATABASE_URL rather than
          # inheriting production's.
          if [ "$ALLOWED" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Migrations are disabled for this deployment (preview)."
          elif [ -z "$DB_URL" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No DATABASE_URL for ${{ inputs.environment }}; migrations were NOT applied."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # ── What is running now, so a rollback has somewhere to go ────────────
      - name: Record the current image
        id: previous
        if: steps.gate.outputs.configured == 'true'
        run: |
          CURRENT=$(az containerapp show \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          echo "image=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Currently running: ${CURRENT:-<nothing — first deployment>}"

      - name: Resolve the Container Apps environment
        id: cae
        if: steps.gate.outputs.configured == 'true'
        run: |
          RG="${{ secrets.RESOURCE_GROUP }}"

          # Discovered from the resource group, not hardcoded. The name, region
          # and log workspace used to be literals naming resources in a
          # DIFFERENT resource group, so pointing RESOURCE_GROUP somewhere else
          # left the app trying to join an environment in another region.
          # Access is probed first, and stderr is NOT discarded. When the
          # deployment identity has no role on $RG, `env list` returns an empty
          # result that is indistinguishable from "this resource group has no
          # environment yet" -- so the step went on to CREATE one and failed
          # with a second, more confusing authorization error instead of naming
          # the real problem, which is a missing role assignment.
          if ! LOC=$(az group show -n "$RG" --query location -o tsv 2>&1); then
            echo "::error::The deployment identity cannot read resource group '$RG'."
            echo "$LOC"
            echo ""
            echo "This is almost always a missing role assignment rather than a wrong name."
            echo "Grant the CI service principal Contributor on that resource group:"
            echo ""
            echo "  az role assignment create --assignee <ci-service-principal-app-id> \\"
            echo "    --role Contributor \\"
            echo "    --scope /subscriptions/<subscription-id>/resourceGroups/$RG"
            exit 1
          fi

          # An explicit name wins. finops-rg now holds more than one Container
          # Apps environment -- the original, and a VNet-integrated one that can
          # reach the private database -- and taking [0] from a list would pick
          # between them by luck. The wrong choice produces an app that starts
          # cleanly and then cannot reach its database, which is a far more
          # expensive failure than refusing here.
          NAME="${{ vars.CONTAINERAPPS_ENVIRONMENT }}"

          if [ -n "$NAME" ]; then
            echo "Using CONTAINERAPPS_ENVIRONMENT: $NAME"
          else
            COUNT=$(az containerapp env list -g "$RG" --query "length([])" -o tsv)

            if [ "$COUNT" = "0" ]; then
              NAME="$RG-env"
              echo "No Container Apps environment in $RG; creating $NAME in $LOC"
              az containerapp env create --name "$NAME" --resource-group "$RG" \
                --location "$LOC" --tags creator=arjun.rathod@cirruslabs.io \
                --only-show-errors
            elif [ "$COUNT" = "1" ]; then
              NAME=$(az containerapp env list -g "$RG" --query "[0].name" -o tsv)
              echo "One environment in $RG, using it: $NAME"
            else
              echo "::error::$RG holds $COUNT Container Apps environments, so the target is ambiguous."
              az containerapp env list -g "$RG" \
                --query "[].{name:name,location:location,vnet:properties.vnetConfiguration.infrastructureSubnetId}" \
                -o table || true
              echo ""
              echo "Set a CONTAINERAPPS_ENVIRONMENT variable naming the one to deploy into."
              echo "Pick the VNet-integrated one if the database has no public endpoint."
              exit 1
            fi
          fi

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Container Apps environment: $NAME"

      - name: Apply migrations (inside the VNet)
        if: steps.migrations.outputs.run == 'true'
        run: |
          RG="${{ secrets.RESOURCE_GROUP }}"
          JOB="${{ secrets.CONTAINER_APP_NAME }}-migrate"
          IMAGE="${{ steps.image.outputs.ref }}"

          # A Container Apps Job on the same environment as the app, so it runs
          # inside the VNet and can reach a database with no public endpoint.
          # This is why migrations are not run from the runner.
          #
          # Deleted and recreated rather than updated: it is a manual-trigger
          # job holding no state, and recreating guarantees the image, args and
          # secret are this deployment's rather than a previous run's.
          az containerapp job delete -n "$JOB" -g "$RG" --yes --only-show-errors >/dev/null 2>&1 || true

          REGISTRY_ARGS=()
          if [ "${{ steps.auth.outputs.method }}" = "secret" ]; then
            REGISTRY_ARGS=(
              --registry-server ${{ secrets.ACR_LOGIN_SERVER }}
              --registry-username ${{ secrets.ACR_USERNAME }}
              --registry-password ${{ secrets.ACR_PASSWORD }}
            )
          else
            REGISTRY_ARGS=(--mi-system-assigned --registry-identity system)
          fi

          az containerapp job create \
            --name "$JOB" \
            --resource-group "$RG" \
            --environment "${{ steps.cae.outputs.name }}" \
            --trigger-type Manual \
            --replica-timeout 1800 \
            --replica-retry-limit 0 \
            --parallelism 1 \
            --replica-completion-count 1 \
            --image "$IMAGE" \
            --cpu 0.5 --memory 1Gi \
            --command node --args "dist/migrate.js" \
            "${REGISTRY_ARGS[@]}" \
            --secrets "database-url=${{ secrets.DATABASE_URL }}" \
            --env-vars "DATABASE_URL=secretref:database-url" \
            --tags creator=arjun.rathod@cirruslabs.io environment=${{ inputs.environment }} \
            --only-show-errors

          az containerapp job start -n "$JOB" -g "$RG" --only-show-errors >/dev/null

          echo "Waiting for the migration job to finish..."
          for attempt in $(seq 1 60); do
            STATUS=$(az containerapp job execution list -n "$JOB" -g "$RG" \
              --query "sort_by([], &properties.startTime)[-1].properties.status" -o tsv 2>/dev/null)
            echo "  attempt $attempt: ${STATUS:-pending}"
            case "$STATUS" in
              Succeeded) echo "Migrations applied."; exit 0 ;;
              Failed|Degraded)
                echo "::error::The migration job failed. Its output follows."
                az containerapp job logs show -n "$JOB" -g "$RG" --container "$JOB" --tail 100 2>/dev/null || true
                exit 1 ;;
            esac
            sleep 10
          done

          echo "::error::The migration job did not finish within 10 minutes."
          az containerapp job logs show -n "$JOB" -g "$RG" --container "$JOB" --tail 100 2>/dev/null || true
          exit 1

      - name: Create or update the Container App
        if: steps.gate.outputs.configured == 'true'
        run: |
          IMAGE="${{ steps.image.outputs.ref }}"
          APP="${{ secrets.CONTAINER_APP_NAME }}"
          echo "Deploying $IMAGE to $APP (${{ inputs.environment }})"

          ENV_VARS=(
            "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            "SESSION_SECRET=${{ secrets.SESSION_SECRET }}"
            "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"
            "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}"
            "ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}"
            "NODE_ENV=production"
            "APP_ENVIRONMENT=${{ inputs.environment }}"
            "PORT=5173"
          )

          if az containerapp show --name "$APP" \
               --resource-group ${{ secrets.RESOURCE_GROUP }} --only-show-errors &>/dev/null; then
            az containerapp update \
              --name "$APP" \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --image "$IMAGE" \
              --set-env-vars "${ENV_VARS[@]}" \
              --only-show-errors
          else
            # Registry credentials are passed only on the secret path. Under
            # OIDC there is no registry password to hand over, so the app is
            # created with a system-assigned identity and granted AcrPull
            # below — which is the same "no stored key" property, applied to
            # the pull as well as the push.
            REGISTRY_ARGS=()
            if [ "${{ steps.auth.outputs.method }}" = "secret" ]; then
              REGISTRY_ARGS=(
                --registry-server ${{ secrets.ACR_LOGIN_SERVER }}
                --registry-username ${{ secrets.ACR_USERNAME }}
                --registry-password ${{ secrets.ACR_PASSWORD }}
              )
            else
              REGISTRY_ARGS=(--system-assigned)
            fi

            az containerapp create \
              --name "$APP" \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --environment "${{ steps.cae.outputs.name }}" \
              --image "$IMAGE" \
              "${REGISTRY_ARGS[@]}" \
              --target-port 5173 \
              --ingress external \
              --min-replicas ${{ inputs.min_replicas }} \
              --max-replicas ${{ inputs.max_replicas }} \
              --env-vars "${ENV_VARS[@]}" \
              --tags creator=arjun.rathod@cirruslabs.io environment=${{ inputs.environment }} \
              --only-show-errors
          fi

      - name: Resolve the public URL
        id: url
        if: steps.gate.outputs.configured == 'true'
        run: |
          FQDN=$(az containerapp show \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$FQDN" >> "$GITHUB_OUTPUT"

      # ── Prove it, do not assume it ────────────────────────────────────────
      - name: Wait for the new revision
        id: revision
        if: steps.gate.outputs.configured == 'true'
        run: |
          APP=${{ secrets.CONTAINER_APP_NAME }}
          RG=${{ secrets.RESOURCE_GROUP }}

          # Azure is the authority on which revision is live. Probing HTTP
          # first cannot distinguish a broken new revision from the previous one
          # still serving, and the previous image may not even have the endpoint
          # being probed — which is how a correct deployment reported 401 thirty
          # times and was rolled back.
          for attempt in $(seq 1 40); do
            STATE=$(az containerapp revision list --name "$APP" --resource-group "$RG" \
              --query "sort_by([?properties.active], &properties.createdTime)[-1].properties.[runningState,healthState]" \
              -o tsv 2>/dev/null || true)
            echo "  attempt $attempt: $STATE"
            case "$STATE" in
              *Running*Healthy*|*Running*None*) echo "revision is running"; exit 0 ;;
              *Failed*|*Degraded*)
                echo "::error::The new revision entered state '$STATE'."
                az containerapp logs show --name "$APP" --resource-group "$RG" --tail 60 --type console 2>/dev/null || true
                exit 1 ;;
            esac
            sleep 10
          done

          echo "::error::The new revision never started. Last state: $STATE"
          az containerapp logs show --name "$APP" --resource-group "$RG" --tail 60 --type console 2>/dev/null || true
          exit 1

      - name: Smoke test
        id: smoke
        if: steps.gate.outputs.configured == 'true'
        run: |
          URL="${{ steps.url.outputs.url }}"
          WANT="${{ inputs.image_tag }}"
          echo "Probing $URL/api/ready, expecting commit $WANT"

          # /api/ready, not /api/health: health only proves node started, and a
          # container serves it happily while every request needing data fails.
          # Readiness proves the database answers.
          #
          # And the COMMIT is compared, not just the status code. Container Apps
          # keeps the previous revision serving until the new one is healthy, so
          # a 200 here can come from the OLD revision and say nothing about this
          # deployment. The commit is the only thing that proves the response
          # came from the image just built.
          for attempt in $(seq 1 20); do
            CODE=$(curl -s -o /tmp/body -m 10 -w '%{http_code}' "$URL/api/ready" || echo 000)
            GOT=$(grep -o '"commit":"[^"]*"' /tmp/body | cut -d'"' -f4)

            if [ "$CODE" = "200" ] && [ "$GOT" = "$WANT" ]; then
              echo "ready on the new revision after ${attempt} attempt(s)"
              exit 0
            fi

            if [ "$CODE" = "200" ] && [ -n "$GOT" ]; then
              echo "  attempt $attempt: healthy, but still the old revision ($GOT)"
            else
              echo "  attempt $attempt: HTTP $CODE ${GOT:+commit $GOT}"
            fi
            sleep 10
          done

          echo "::error::${{ inputs.environment }} never served commit $WANT. Last: HTTP $CODE $(cat /tmp/body 2>/dev/null)"
          exit 1

      # ── Put it back ───────────────────────────────────────────────────────
      - name: Roll back
        if: failure() && steps.gate.outputs.configured == 'true' && steps.previous.outputs.image != ''
        run: |
          PREVIOUS="${{ steps.previous.outputs.image }}"
          echo "::warning::${{ inputs.environment }} did not come up. Rolling back to $PREVIOUS"

          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image "$PREVIOUS" \
            --only-show-errors

          # Resolved here, not read from the earlier step. That step is SKIPPED
          # whenever the deployment failed before reaching it, so the rollback
          # probed an empty URL, failed every time, and reported "the previous
          # image is not healthy either" regardless of the actual state.
          FQDN=$(az containerapp show \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)

          if [ -z "$FQDN" ]; then
            echo "::error::Rolled back to $PREVIOUS, but the app has no ingress hostname to verify against. Check it by hand."
            exit 1
          fi

          # /api/health, NOT /api/ready. The image being restored is by
          # definition older, and may predate the readiness endpoint — as the
          # one here did. authGuard answers every unknown /api/* path with 401,
          # so probing readiness against an older image reports it as broken
          # when it is serving perfectly. Liveness has existed far longer and is
          # the right question here: did the previous version come back up?
          sleep 20
          for attempt in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "https://$FQDN/api/health" || echo 000)
            [ "$CODE" = "200" ] && { echo "Rollback healthy at https://$FQDN"; exit 0; }
            sleep 10
          done
          echo "::error::Rolled back to $PREVIOUS, but https://$FQDN/api/health is still not answering. Manual intervention needed."
          exit 1

      - name: Summarise
        if: always()
        run: |
          {
            if [ "${{ steps.gate.outputs.configured }}" != "true" ]; then
              # Nothing to add: the gate already wrote the full explanation and
              # failed the job. Calling it "skipped" here understated it.
              :
            elif [ "${{ job.status }}" = "success" ]; then
              echo "### ${{ inputs.environment }} — deployed"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| Image | \`${{ steps.image.outputs.ref }}\` |"
              echo "| URL | ${{ steps.url.outputs.url }} |"
            else
              echo "### ${{ inputs.environment }} — FAILED"
              echo ""
              echo "Attempted \`${{ steps.image.outputs.ref }}\`."
              echo "Previous image was \`${{ steps.previous.outputs.image }}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
