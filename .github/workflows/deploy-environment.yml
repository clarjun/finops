# One environment's deployment, called three times by cd.yml.
#
# A reusable workflow rather than three copies of the same 150 lines. The Azure
# steps are fiddly — provider registration, create-or-update, URL resolution —
# and three copies means a fix applied to production and forgotten in staging,
# which is how staging stops resembling production and stops being a useful
# rehearsal.
#
# ── How an environment is addressed ─────────────────────────────────────────
#
# Every secret here is read by its ORDINARY name — CONTAINER_APP_NAME,
# DATABASE_URL, SESSION_SECRET — and GitHub resolves each to the value defined
# on the environment this job declares. Define them once per environment and the
# same reference picks up the right value.
#
# That only works here, and not in the caller: environment-scoped secrets
# resolve exclusively inside a job that declares `environment:`, which is why
# cd.yml passes `secrets: inherit` rather than forwarding them by hand.
#
# ── The interlock, and why it exists ────────────────────────────────────────
#
# When an environment does NOT define a secret, GitHub silently falls back to
# the repository-level one. For CONTAINER_APP_NAME that fallback is production's
# app — so a half-configured `dev` environment would deploy dev's image over
# production. That is the single worst thing this pipeline could do, and it
# would look like a successful deployment.
#
# So the caller passes production's name in as `production_app_name`, and any
# non-production environment resolving to that same name refuses to deploy.

name: Deploy to an environment

on:
  workflow_call:
    inputs:
      environment:
        description: 'dev | staging | production'
        required: true
        type: string
      image:
        description: 'Fully qualified image reference to deploy'
        required: true
        type: string
      production_app_name:
        description: >-
          Production's Container App name, read at the repository level by the
          caller. Used only to detect an environment that has not defined its
          own CONTAINER_APP_NAME and has therefore inherited production's.
        required: false
        type: string
        default: ''
      min_replicas:
        required: false
        type: number
        default: 1
      max_replicas:
        required: false
        type: number
        default: 3
    outputs:
      url:
        description: 'Public URL of the deployed environment'
        value: ${{ jobs.deploy.outputs.url }}
      deployed:
        description: 'false when the environment is not configured and was skipped'
        value: ${{ jobs.deploy.outputs.deployed }}

permissions:
  contents: read
  # Required for workload identity federation: without it the runner cannot
  # request the OIDC token Azure exchanges for a session. Harmless when the
  # secret-based fallback is in use — an unused token is never minted.
  id-token: write

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Declaring the environment is what makes GitHub resolve environment-scoped
    # secrets AND apply that environment's protection rules. A required reviewer
    # configured on `production` pauses the run here until someone approves —
    # the approval gate is GitHub's, not something this file can fake.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.url.outputs.url }}
    outputs:
      url: ${{ steps.url.outputs.url }}
      deployed: ${{ steps.gate.outputs.configured }}

    steps:
      # ── Is this environment set up at all? ────────────────────────────────
      - name: Check the environment is configured
        id: gate
        env:
          APP_NAME: ${{ secrets.CONTAINER_APP_NAME }}
          RG: ${{ secrets.RESOURCE_GROUP }}
          PROD_APP_NAME: ${{ inputs.production_app_name }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ -z "$APP_NAME" ] || [ -z "$RG" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$ENVIRONMENT is not configured (CONTAINER_APP_NAME or \
          RESOURCE_GROUP is unset), so it was skipped. Expected until you create it."
            exit 0
          fi

          # The interlock. A non-production environment that resolved to
          # production's app name did not define its own secret and has
          # inherited the repository-level one. Deploying would overwrite
          # production while reporting success.
          if [ "$ENVIRONMENT" != "production" ] && [ -n "$PROD_APP_NAME" ] \
             && [ "$APP_NAME" = "$PROD_APP_NAME" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::REFUSING TO DEPLOY. The '$ENVIRONMENT' environment resolved \
          CONTAINER_APP_NAME to '$APP_NAME', which is the SAME app production uses. \
          That means '$ENVIRONMENT' has no CONTAINER_APP_NAME of its own and inherited \
          the repository-level secret. Define CONTAINER_APP_NAME on the '$ENVIRONMENT' \
          environment before deploying to it."
            # Skipped, NOT failed. Failing here would halt the promotion before
            # production — breaking a deployment that works today, purely
            # because dev has not been created yet. The annotation above shows
            # red in the UI; the pipeline carries on to the environments that
            # ARE configured.
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Deploying to $APP_NAME in $RG"

      # ── Azure authentication ──────────────────────────────────────────────
      #
      # Two paths, chosen by what is configured. OIDC is preferred and the
      # stored secret is the fallback, so this can be adopted without a flag day
      # and rolled back by clearing one secret.
      #
      # Why OIDC is worth the setup:
      #
      #   AZURE_CREDENTIALS is a service principal's client secret. It is a
      #   long-lived key sitting in GitHub that grants standing access to the
      #   subscription. It does not expire on its own, a leak is permanent until
      #   somebody notices and rotates it, and rotating it means editing secrets
      #   in every repository that holds a copy.
      #
      #   Federation stores NOTHING. The runner proves which repository, branch
      #   and environment it is running as, Entra ID checks that against a
      #   federated credential you defined, and issues a token good for this one
      #   job. There is no secret to leak, and the trust is scoped to a specific
      #   repo and environment rather than to whoever holds the key.
      - name: Choose an authentication method
        id: auth
        if: steps.gate.outputs.configured == 'true'
        env:
          OIDC_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          LEGACY_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -n "$OIDC_CLIENT_ID" ]; then
            echo "method=oidc" >> "$GITHUB_OUTPUT"
            echo "Authenticating with workload identity federation (no stored secret)."
          elif [ -n "$LEGACY_CREDS" ]; then
            echo "method=secret" >> "$GITHUB_OUTPUT"
            echo "::warning::Authenticating with the stored AZURE_CREDENTIALS service \
          principal secret. Set AZURE_CLIENT_ID, AZURE_TENANT_ID and \
          AZURE_SUBSCRIPTION_ID to switch to OIDC and remove the long-lived key."
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
            echo "::error::No Azure credentials configured — neither AZURE_CLIENT_ID \
          (OIDC) nor AZURE_CREDENTIALS."
            exit 1
          fi

      - name: Log in to Azure (OIDC)
        if: steps.auth.outputs.method == 'oidc'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure (stored service principal)
        if: steps.auth.outputs.method == 'secret'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install containerapp CLI extension
        if: steps.gate.outputs.configured == 'true'
        run: az extension add --name containerapp --upgrade -y

      # ── Schema before code, per environment ───────────────────────────────
      #
      # Each environment migrates its OWN database, because DATABASE_URL is an
      # environment secret. Running production's migrations against production
      # only after they have already run against dev and staging is the entire
      # point of having the three.
      - name: Check out (for migrations)
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.configured == 'true'
        run: npm ci

      - name: Migration gate
        id: migrations
        if: steps.gate.outputs.configured == 'true'
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No DATABASE_URL for ${{ inputs.environment }}; migrations were NOT applied."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: List pending migrations
        if: steps.migrations.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate -- --dry

      - name: Apply migrations
        if: steps.migrations.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      # ── What is running now, so a rollback has somewhere to go ────────────
      - name: Record the current image
        id: previous
        if: steps.gate.outputs.configured == 'true'
        run: |
          CURRENT=$(az containerapp show \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          echo "image=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Currently running: ${CURRENT:-<nothing — first deployment>}"

      - name: Ensure the Container Apps environment exists
        if: steps.gate.outputs.configured == 'true'
        run: |
          az monitor log-analytics workspace create \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --workspace-name finops-logs \
            --tags creator=arjun.rathod@cirruslabs.io \
            --only-show-errors || true

          WORKSPACE_ID=$(az monitor log-analytics workspace show \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --workspace-name finops-logs --query customerId -o tsv)
          WORKSPACE_KEY=$(az monitor log-analytics workspace get-shared-keys \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --workspace-name finops-logs --query primarySharedKey -o tsv)

          az containerapp env create \
            --name finops-env \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --location eastus \
            --logs-workspace-id "$WORKSPACE_ID" \
            --logs-workspace-key "$WORKSPACE_KEY" \
            --tags creator=arjun.rathod@cirruslabs.io \
            --only-show-errors || true

      - name: Create or update the Container App
        if: steps.gate.outputs.configured == 'true'
        run: |
          IMAGE="${{ inputs.image }}"
          APP="${{ secrets.CONTAINER_APP_NAME }}"
          echo "Deploying $IMAGE to $APP (${{ inputs.environment }})"

          ENV_VARS=(
            "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            "SESSION_SECRET=${{ secrets.SESSION_SECRET }}"
            "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"
            "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}"
            "ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}"
            "NODE_ENV=production"
            "APP_ENVIRONMENT=${{ inputs.environment }}"
            "PORT=5173"
          )

          if az containerapp show --name "$APP" \
               --resource-group ${{ secrets.RESOURCE_GROUP }} --only-show-errors &>/dev/null; then
            az containerapp update \
              --name "$APP" \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --image "$IMAGE" \
              --set-env-vars "${ENV_VARS[@]}" \
              --only-show-errors
          else
            # Registry credentials are passed only on the secret path. Under
            # OIDC there is no registry password to hand over, so the app is
            # created with a system-assigned identity and granted AcrPull
            # below — which is the same "no stored key" property, applied to
            # the pull as well as the push.
            REGISTRY_ARGS=()
            if [ "${{ steps.auth.outputs.method }}" = "secret" ]; then
              REGISTRY_ARGS=(
                --registry-server ${{ secrets.ACR_LOGIN_SERVER }}
                --registry-username ${{ secrets.ACR_USERNAME }}
                --registry-password ${{ secrets.ACR_PASSWORD }}
              )
            else
              REGISTRY_ARGS=(--system-assigned)
            fi

            az containerapp create \
              --name "$APP" \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --environment finops-env \
              --image "$IMAGE" \
              "${REGISTRY_ARGS[@]}" \
              --target-port 5173 \
              --ingress external \
              --min-replicas ${{ inputs.min_replicas }} \
              --max-replicas ${{ inputs.max_replicas }} \
              --env-vars "${ENV_VARS[@]}" \
              --tags creator=arjun.rathod@cirruslabs.io environment=${{ inputs.environment }} \
              --only-show-errors
          fi

      - name: Resolve the public URL
        id: url
        if: steps.gate.outputs.configured == 'true'
        run: |
          FQDN=$(az containerapp show \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$FQDN" >> "$GITHUB_OUTPUT"

      # ── Prove it, do not assume it ────────────────────────────────────────
      - name: Smoke test
        id: smoke
        if: steps.gate.outputs.configured == 'true'
        run: |
          URL="${{ steps.url.outputs.url }}"
          echo "Probing $URL/api/ready"

          # /api/ready, not /api/health: health only proves node started, and a
          # container can serve that happily while every request needing data
          # fails. Readiness proves the database answers.
          #
          # Container Apps keeps the previous revision serving while the new one
          # starts, so an immediate 200 may be the OLD version replying.
          sleep 20

          for attempt in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/body -m 10 -w '%{http_code}' "$URL/api/ready" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "ready after ${attempt} attempt(s): $(cat /tmp/body)"
              exit 0
            fi
            echo "  attempt $attempt: HTTP $CODE"
            sleep 10
          done

          echo "::error::${{ inputs.environment }} never became ready. Last body: $(cat /tmp/body 2>/dev/null)"
          exit 1

      # ── Put it back ───────────────────────────────────────────────────────
      - name: Roll back
        if: failure() && steps.gate.outputs.configured == 'true' && steps.previous.outputs.image != ''
        run: |
          PREVIOUS="${{ steps.previous.outputs.image }}"
          echo "::warning::${{ inputs.environment }} failed its smoke test. Rolling back to $PREVIOUS"

          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image "$PREVIOUS" \
            --only-show-errors

          sleep 20
          for attempt in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "${{ steps.url.outputs.url }}/api/ready" || echo 000)
            [ "$CODE" = "200" ] && { echo "Rollback healthy."; exit 0; }
            sleep 10
          done
          echo "::error::Rolled back, but the previous image is not healthy either. Manual intervention needed."
          exit 1

      - name: Summarise
        if: always()
        run: |
          {
            if [ "${{ steps.gate.outputs.configured }}" != "true" ]; then
              echo "### ${{ inputs.environment }} — skipped (not configured)"
            elif [ "${{ job.status }}" = "success" ]; then
              echo "### ${{ inputs.environment }} — deployed"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| Image | \`${{ inputs.image }}\` |"
              echo "| URL | ${{ steps.url.outputs.url }} |"
            else
              echo "### ${{ inputs.environment }} — FAILED"
              echo ""
              echo "Attempted \`${{ inputs.image }}\`."
              echo "Previous image was \`${{ steps.previous.outputs.image }}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
