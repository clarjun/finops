name: CI/CD — Build, Push & Deploy to Azure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: finops-dashboard
  # ACR name is set via GitHub secret ACR_NAME

jobs:
  # ── Job 1: Build & Test ──────────────────────────────────────────────────────
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── Job 2: Docker Build & Push to ACR ───────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to Azure Container Apps ───────────────────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install containerapp CLI extension
        run: az extension add --name containerapp --upgrade -y

      - name: Register providers
        run: |
          for provider in Microsoft.App Microsoft.OperationalInsights; do
            state=$(az provider show -n $provider --query "registrationState" -o tsv 2>/dev/null)
            if [ "$state" != "Registered" ]; then
              echo "Registering $provider (requires subscription-level permission)..."
              az provider register -n $provider --wait || echo "Warning: Could not register $provider - may need to be done manually"
            else
              echo "$provider already registered, skipping."
            fi
          done

      - name: Create Log Analytics workspace (if not exists)
        run: |
          az monitor log-analytics workspace create \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --workspace-name finops-logs \
            --tags creator=arjun.rathod@cirruslabs.io \
            --only-show-errors || true

      - name: Create Container Apps environment (if not exists)
        run: |
          WORKSPACE_ID=$(az monitor log-analytics workspace show \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --workspace-name finops-logs \
            --query customerId -o tsv)
          WORKSPACE_KEY=$(az monitor log-analytics workspace get-shared-keys \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --workspace-name finops-logs \
            --query primarySharedKey -o tsv)
          az containerapp env create \
            --name finops-env \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --location eastus \
            --logs-workspace-id "$WORKSPACE_ID" \
            --logs-workspace-key "$WORKSPACE_KEY" \
            --tags creator=arjun.rathod@cirruslabs.io \
            --only-show-errors || true

      - name: Create or update Container App
        run: |
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          ENV_VARS="DATABASE_URL=${{ secrets.DATABASE_URL }} \
            SESSION_SECRET=${{ secrets.SESSION_SECRET }} \
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }} \
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }} \
            NODE_ENV=production \
            PORT=5173"

          # Check if app exists
          if az containerapp show \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --only-show-errors &>/dev/null; then
            echo "Updating existing Container App..."
            az containerapp update \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --image "$IMAGE" \
              --set-env-vars $ENV_VARS \
              --only-show-errors
          else
            echo "Creating new Container App..."
            az containerapp create \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --environment finops-env \
              --image "$IMAGE" \
              --registry-server ${{ secrets.ACR_LOGIN_SERVER }} \
              --registry-username ${{ secrets.ACR_USERNAME }} \
              --registry-password ${{ secrets.ACR_PASSWORD }} \
              --target-port 5173 \
              --ingress external \
              --min-replicas 1 \
              --max-replicas 3 \
              --env-vars $ENV_VARS \
              --tags creator=arjun.rathod@cirruslabs.io \
              --only-show-errors
          fi

      - name: Get app URL
        run: |
          URL=$(az containerapp show \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "✅ App deployed at: https://$URL"
